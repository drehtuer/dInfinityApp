# SonarQube configuration, read by the sonar-scanner CLI that CI runs after the
# build (.github/workflows/ci.yml). This is the only Sonar configuration in the
# repository: automatic analysis is switched off, so there is no second file to
# keep in step.
#
# It has to be the scanner rather than automatic analysis for two reasons:
# automatic analysis cannot ingest a coverage report at all, and it ignores
# `sonar.issue.ignore.*`, so a reviewed-and-accepted finding could only be
# clicked away in the web UI instead of being recorded here.
#
# SONAR_TOKEN comes from the repository's GitHub secrets and is never written
# here. The key and organization below match the SonarCloud project it belongs
# to.

sonar.projectKey=drehtuer_dInfinityApp
sonar.organization=drehtuer
sonar.host.url=https://sonarcloud.io
sonar.projectName=dInfinity
# sonar.projectVersion is passed by CI from version.txt.

sonar.sourceEncoding=UTF-8

# One scan over the whole repository rather than a module list, so a new module
# is analysed the moment it exists — and so is everything that is not a module:
# the Dockerfile, the workflows, the Gradle scripts and the Python tooling all
# ship with the project and can all be wrong.
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/src/test/**,**/src/androidTest/**

sonar.java.source=21
sonar.java.binaries=**/build/classes,**/build/tmp/kotlin-classes
sonar.kotlin.threads=4

# Coverage. `./gradlew coverageReport` writes one report per module: Gradle's
# own for the pure Kotlin modules, AGP's for the Android ones. Sonar merges the
# list itself. Function and branch coverage are what matter (.claude/CLAUDE.md)
# — line coverage alone rewards code that merely runs.
sonar.coverage.jacoco.xmlReportPaths=\
  **/build/reports/jacoco/test/jacocoTestReport.xml,\
  **/build/reports/coverage/test/debug/report.xml
sonar.junit.reportPaths=\
  **/build/test-results/test,\
  **/build/test-results/testDebugUnitTest

# Not product code, or not analysable here.
#
# design/ is the imported UI prototype: someone else's generated HTML, CSS and
# JavaScript, kept verbatim so it stays comparable with the source it came
# from. It is specification, not product code, and editing it to satisfy a
# linter would break that.
#
# The test directories are named again here because `sonar.sources=.` and
# `sonar.tests=.` cover the same tree; without this the scanner refuses to
# index a test file twice.
sonar.exclusions=\
  **/build/**,\
  **/.gradle/**,\
  design/**,\
  docs/**,\
  **/*.dc.html,\
  **/generated/**,\
  **/src/test/**,\
  **/src/androidTest/**

# The physics bridge and the renderer can only be exercised on a device
# (docs/TODO.md, Step 5), so their coverage figure would be meaningless. They
# stay in the analysis — only the coverage measurement is excluded, and the
# device results are reported separately so the gap stays visible.
sonar.coverage.exclusions=\
  simulation/jolt/**,\
  render/filament/**,\
  **/*Preview.kt,\
  app/src/main/kotlin/**/MainActivity.kt

# xml:S6358 on the manifest asks whether allowing application backup is safe.
# It is, and deliberately so: cloud backup is excluded completely in
# data_extraction_rules.xml, while device-to-device transfer is kept on purpose
# so a new phone does not cost the player their history. Android's own guidance
# for an app with data worth protecting is to leave `allowBackup` alone and
# restrict through the extraction rules, which is exactly what this app does —
# and on Android 12+ setting it to `false` would not reliably stop D2D anyway.
#
# Recorded here rather than only accepted in the SonarQube UI, so the decision
# is versioned next to the reasoning in SECURITY.md and survives the finding
# being raised afresh when the manifest is next edited.

# docker:S7026 asks for `ADD <url>` instead of `curl` for the Gradle and
# sonar-scanner archives. ADD writes the archive into its own image layer, and a
# later `rm` cannot reclaim it — the two zips are about 190 MB, which would ride
# in the image for ever. `curl … && unzip && rm` in one layer keeps them out of
# it. The integrity argument for ADD is `--checksum`, which cannot take the
# version from an ARG; pinning downloads by hash is a real gap and is tracked in
# docs/TODO.md as dependency verification, not solved by changing this line.
# kotlin:S1135 ("complete the task associated to this TODO comment") matches the
# *filename* `docs/TODO.md`, which this project's conventions tell comments to
# cite — there is not one real TODO comment in the Kotlin sources. detekt's
# ForbiddenComment rule already fails the build on a genuine `TODO:`, and it
# does not confuse a path for a marker, so nothing is lost by turning this one
# off and the false positives go away.
sonar.issue.ignore.multicriteria=backupReviewed,archiveDownloads,todoFilename
sonar.issue.ignore.multicriteria.backupReviewed.ruleKey=xml:S6358
sonar.issue.ignore.multicriteria.backupReviewed.resourceKey=app/src/main/AndroidManifest.xml
sonar.issue.ignore.multicriteria.archiveDownloads.ruleKey=docker:S7026
sonar.issue.ignore.multicriteria.archiveDownloads.resourceKey=.devcontainer/Dockerfile
sonar.issue.ignore.multicriteria.todoFilename.ruleKey=kotlin:S1135
sonar.issue.ignore.multicriteria.todoFilename.resourceKey=**/*.kt

# SonarQube configuration for the sonar-scanner CLI.
#
# CI runs the scanner after the build so it can pick up the test and coverage
# reports; SONAR_TOKEN comes from the repository's GitHub secrets and is never
# written here. The key and organization below match the SonarCloud project the
# token belongs to.

sonar.projectKey=drehtuer_dInfinityApp
sonar.organization=drehtuer
sonar.host.url=https://sonarcloud.io
sonar.projectName=dInfinity
# sonar.projectVersion is passed by CI from version.txt:
#   sonar-scanner -Dsonar.projectVersion="$(cat version.txt)"

sonar.sourceEncoding=UTF-8

# One scan over the whole repository rather than a module list, so a new module
# is analysed the moment it exists.
sonar.sources=.
sonar.inclusions=**/src/main/**
sonar.tests=.
sonar.test.inclusions=**/src/test/**,**/src/androidTest/**

sonar.java.source=21
sonar.java.binaries=**/build/classes,**/build/tmp/kotlin-classes
sonar.kotlin.threads=4

# Coverage. JaCoCo runs on the JVM and Robolectric suites; the reports land
# here once plan Step 2 wires it up. Function and branch coverage are what
# matter (.claude/CLAUDE.md) — line coverage alone rewards code that merely
# runs.
sonar.coverage.jacoco.xmlReportPaths=**/build/reports/jacoco/**/*.xml
sonar.junit.reportPaths=**/build/test-results/test,**/build/test-results/testDebugUnitTest

# Not product code, or not analysable here.
sonar.exclusions=\
  **/build/**,\
  design/**,\
  docs/**,\
  **/*.dc.html,\
  **/generated/**

# The physics bridge and the renderer can only be exercised on a device
# (docs/TODO.md, Step 5), so their coverage figure would be meaningless. They
# stay in the analysis — only the coverage measurement is excluded, and the
# device results are reported separately so the gap stays visible.
sonar.coverage.exclusions=\
  simulation/jolt/**,\
  render/filament/**,\
  **/*Preview.kt,\
  app/src/main/kotlin/**/MainActivity.kt

org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false
android.defaults.buildfeatures.resvalues=false
android.defaults.buildfeatures.shaders=false

kotlin.code.style=official

# The Android API the project builds against (compileSdk and targetSdk).
# Keep in step with ANDROID_API in .devcontainer/Dockerfile.
dinfinity.androidApi=37

# Pinned so AGP uses the build-tools the image installed rather than
# downloading its own default on first build. Must match what
# .devcontainer/Dockerfile resolves for this API.
dinfinity.buildTools=37.0.0

# minSdk is 36, not 37: Robolectric cannot run API 37 yet and cannot run below
# minSdk either, so a minSdk of 37 would mean no Robolectric tests at all —
# one of the three testing tiers, traded for one API level of reach. Decided;
# see decision 17 in docs/architecture.md.
dinfinity.minSdk=36

# The coverage floor, enforced by `verifyCoverage` in the root build. Raising
# these is a visible line in a diff; lowering them is an argument to make in a
# pull request. SonarQube enforces the branch figure too, but has no counter
# for functions at all — see docs/build-setup.md.
dinfinity.coverage.minFunction=85.0
dinfinity.coverage.minBranch=62.0

# Configuration for SonarQube Cloud's **automatic analysis**, which is what
# runs today. Automatic analysis does not read `sonar-project.properties` — it
# reads this file — so the two have to agree until CI takes over the scan
# (docs/TODO.md, Step 2) and this file can go.
#
# Keep the exclusions below in step with sonar-project.properties.

sonar.sources=.
sonar.inclusions=**/src/main/**
sonar.tests=.
sonar.test.inclusions=**/src/test/**,**/src/androidTest/**

# design/ is the imported UI prototype: someone else's generated HTML, CSS and
# JavaScript, kept verbatim so it stays comparable with the source it came
# from. It is specification, not product code, and editing it to satisfy a
# linter would break that. It accounted for 211 of the first 229 findings.
sonar.exclusions=\
  **/build/**,\
  design/**,\
  docs/**,\
  **/*.dc.html,\
  **/generated/**

sonar.coverage.exclusions=\
  simulation/jolt/**,\
  render/filament/**,\
  **/*Preview.kt,\
  app/src/main/kotlin/**/MainActivity.kt

# xml:S6358 on the manifest asks whether allowing application backup is safe.
# It is, and deliberately so: cloud backup is excluded completely in
# data_extraction_rules.xml, while device-to-device transfer is kept on purpose
# so a new phone does not cost the player their history. Android's own guidance
# for an app with data worth protecting is to leave `allowBackup` alone and
# restrict through the extraction rules, which is exactly what this app does —
# and on Android 12+ setting it to `false` would not reliably stop D2D anyway.
# Suppressed here rather than clicked away in the SonarQube UI, so the decision
# lives in the repository next to the reasoning in SECURITY.md.
sonar.issue.ignore.multicriteria=backupReviewed
sonar.issue.ignore.multicriteria.backupReviewed.ruleKey=xml:S6358
sonar.issue.ignore.multicriteria.backupReviewed.resourceKey=app/src/main/AndroidManifest.xml

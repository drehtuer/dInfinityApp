name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so a newly published query finds old code without waiting for
    # someone to touch it.
    - cron: "23 4 * * 1"

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  analyze:
    name: Analyse ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: manual
          # The workflows in this repository are code too, and the queries for
          # them catch the expression-injection mistakes that turn a pull
          # request title into a shell command.
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@v4

      - name: Set up the Android build
        if: matrix.build-mode == 'manual'
        uses: ./.github/actions/setup-android-build

      - name: Initialise CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality

      # CodeQL extracts what it watches being compiled, so the build must
      # actually compile: no daemon to hide the work in, and neither cache
      # allowed to answer instead of the compiler.
      - name: Build for analysis
        if: matrix.build-mode == 'manual'
        run: |
          ./gradlew assembleDebug \
            --no-daemon --no-build-cache --no-configuration-cache --stacktrace

      - name: Analyse
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}

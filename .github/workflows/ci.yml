name: CI

on:
  push:
    branches: [main]
  # Every pull request, not only the ones aimed at main. This repository stacks
  # them — each branch based on the one before it, so they merge in order
  # (`.claude/CLAUDE.md`) — and a `branches: [main]` filter here means every
  # pull request in a stack but the first runs no checks at all: green because
  # nothing was asked, which is the worst kind of green. The push trigger stays
  # on main, where it feeds the dependency graph and the caches.
  pull_request:

# A new push to a branch makes the run in flight pointless. main is exempt:
# its runs feed the dependency graph and the caches.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  build:
    name: Build, test and analyse
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      # SonarQube decorates the pull request with its findings.
      pull-requests: write
      # The test-results check is published as a check run, which needs its own
      # permission — without it the annotation step reads the results, reports
      # what it found, and then silently fails to post anything.
      checks: write
    # At job level so the `if:` on the scan step can see it. A step's own `env:`
    # is not in scope for that step's own condition.
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # SonarQube reads the git history to attribute issues to a commit and
          # an author, and to work out what "new code" means. A shallow clone
          # makes it treat every line as new.
          fetch-depth: 0

      - uses: ./.github/actions/setup-android-build

      # version.txt is the one source of truth for the version (see
      # dinfinity.android-app.gradle.kts); Sonar labels the analysis with it.
      - name: Read the version
        id: version
        run: echo "value=$(cat version.txt)" >> "$GITHUB_OUTPUT"

      # The same command docs/build-setup.md tells a developer to run, so a
      # green PR means the same thing as a green machine. `check` also carries
      # the repository invariants: the module graph, the README index, and that
      # git ignores no source file. `coverageReport` is here rather than in a
      # job of its own so the scan reuses this build instead of paying for a
      # second one.
      - name: Build, test and analyse
        run: ./gradlew build test coverageReport lint detekt ktlintCheck --stacktrace

      - name: Upload test, lint and coverage reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reports
          path: |
            **/build/reports/**
            **/build/test-results/**
          retention-days: 14
          if-no-files-found: ignore

      # Puts failures where they are read: on the pull request, as a check with
      # the failing test named and its stack trace, rather than only in the run
      # log and the uploaded reports. Runs even when the build failed — that is
      # exactly when it is worth having.
      - name: Annotate test results
        if: ${{ !cancelled() }}
        uses: mikepenz/action-junit-report@a9170d5795813c01ab4901ffb045b52bab4ab09d # v6.5.0
        with:
          report_paths: "**/build/test-results/*/TEST-*.xml"
          check_name: "Test results"
          detailed_summary: true
          include_passed: false
          # The build step has already failed the job by this point; a second
          # failure here would only obscure which step was the cause.
          fail_on_failure: false
          require_tests: true

      # Runs after the build so it can pick up the JaCoCo XML and the JUnit
      # results; sonar-project.properties names the paths. Skipped when the
      # token is absent, which is what a pull request from a fork looks like —
      # a missing token should not read as a failed build.
      #
      # `qualitygate.wait` makes the scanner block on the gate and exit non-zero
      # when it is red, so a failing gate fails the check rather than merely
      # showing up on sonarcloud.io.
      - name: SonarQube scan
        if: ${{ !cancelled() && env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        with:
          args: >
            -Dsonar.projectVersion=${{ steps.version.outputs.value }}
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=600

  # Instrumented tests cannot run here — they need the phone (.claude/CLAUDE.md,
  # docs/build-setup.md). This job only proves the device suite still compiles,
  # so it cannot rot between runs on real hardware.
  device-tests-compile:
    name: Device tests compile
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-android-build
      - run: ./gradlew assembleDebugAndroidTest --stacktrace

  # Markdown is most of the specification, so it gets the same treatment as the
  # code. The checks that need no Node — that README.md indexes every document,
  # and that every relative link resolves — are Gradle tasks in `check`, so a
  # developer runs them without leaving the devcontainer. These two need Node
  # and a headless browser, which the devcontainer does not carry for one
  # linter and one diagram.
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0

      # A mermaid fence that does not parse renders as an error box on GitHub,
      # which nobody notices until someone opens the document. mermaid-cli
      # brings its own Chromium, so this runs in the published image rather
      # than installing a browser on the runner.
      - name: Mermaid diagrams parse
        run: |
          set -euo pipefail
          mapfile -t documents < <(grep -rl '```mermaid' --include='*.md' \
            --exclude-dir=build --exclude-dir=node_modules --exclude-dir=.git . || true)
          if [ ${#documents[@]} -eq 0 ]; then
            echo "No mermaid diagrams found."
            exit 0
          fi
          mkdir -p "${RUNNER_TEMP}/mermaid"
          python3 - "${RUNNER_TEMP}/mermaid" "${documents[@]}" <<'PY'
          import pathlib, re, sys
          out = pathlib.Path(sys.argv[1])
          for document in sys.argv[2:]:
              source = pathlib.Path(document)
              for index, match in enumerate(re.finditer(r"```mermaid\n(.*?)```", source.read_text(), re.S)):
                  name = f"{source.as_posix().replace('/', '_')}.{index}.mmd"
                  (out / name).write_text(match.group(1))
                  print(f"{document}: diagram {index + 1} -> {name}")
          PY
          # The image's entrypoint is mmdc itself, so it is replaced to loop over
          # the diagrams. That means repeating what the entrypoint did: mmdc by
          # full path, and -p, which is how it finds the bundled Chromium.
          docker run --rm -v "${RUNNER_TEMP}/mermaid:/data" -w /data --entrypoint sh \
            minlag/mermaid-cli@sha256:bad64c9d9ad917c8dfbe9d9e9c162b96f6615ff019b37058638d16eb27ce7783 \
            -c 'for diagram in *.mmd; do
                  echo "parsing $diagram"
                  /home/mermaidcli/node_modules/.bin/mmdc -p /puppeteer-config.json \
                    -i "$diagram" -o /tmp/out.svg || exit 1
                done'

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # A dependency that ships a known-vulnerable transitive is exactly
          # the failure this repository's threat model cares about.
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure
          # GPL-2.0-or-later, so copyleft is fine and permissive is fine.
          # These three are the ones that would actually be a problem.
          deny-licenses: BUSL-1.1, SSPL-1.0, Elastic-2.0

  # Feeds the resolved Gradle graph — transitive dependencies included — to
  # GitHub's dependency graph, so Dependabot alerts see what the build actually
  # pulls in rather than only what the version catalog names.
  dependency-graph:
    name: Submit dependency graph
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Resolving every configuration configures the Android plugins, so the
      # SDK has to be here too. The action brings its own Gradle.
      - uses: ./.github/actions/setup-android-build
        with:
          setup-gradle: "false"
      - uses: gradle/actions/dependency-submission@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          # Only what ships in the APK. Resolving *every* configuration also
          # submits the build's own toolchain — the copies of jdom2,
          # bouncycastle, commons-lang3, logback and httpclient that AGP and
          # the Kotlin plugin drag in — and Dependabot then opens security
          # updates it cannot possibly apply, because nothing in this
          # repository declares those dependencies to bump. Thirteen alerts
          # and thirteen failing jobs, none of them actionable.
          #
          # Build-tool advisories are still handled, by the weekly AGP and
          # Kotlin bumps that carry the fixed transitives with them.
          # Note the absence of a bare `runtimeClasspath`: that is the
          # configuration build-logic uses, and build-logic depends on AGP,
          # which is where jdom2, bouncycastle, jose4j and commons-lang3 come
          # from. The app's own debug and release runtime classpaths already
          # carry every shipped dependency transitively, so nothing is lost.
          dependency-graph-include-configurations: "^(debug|release)RuntimeClasspath$"
